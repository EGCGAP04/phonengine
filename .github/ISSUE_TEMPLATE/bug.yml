name: "🐛 Bug"
description: Something does not work as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the input segments, rule definition, and inventory if relevant.
      placeholder: |
        1. Define inventory with ...
        2. Apply rule ...
        3. Observe ...
    validations:
      required: true

  - type: dropdown
    id: milestone
    attributes:
      label: Milestone
      description: Which stage of the roadmap does this belong to?
      # The open milestones, under their exact GitHub titles. The same list is in
      # every form in this folder: add a milestone to all of them when it is
      # created, and drop it from all of them when it closes.
      options:
        - "M0: Repository setup"
        - "M1: Core phonology and engine"
        - "M2: DSL parser and maximal munch"
        - "M3: Dialect trees and directional rules"
        - "M4: CLI and export formats"
        - Not defined yet
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Error messages, traces, or anything else relevant
    validations:
      required: false
